apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/anilkumaruak93/ecommerce-production-platform.git
    targetRevision: feature
    path: helm/ecommerce

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
