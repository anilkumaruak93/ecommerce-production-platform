apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecommerce-role
  namespace: {{ .Release.Namespace }}

rules:
- apiGroups: [""]
  resources:
    - pods
    - services
    - configmaps
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecommerce-rolebinding
  namespace: {{ .Release.Namespace }}

subjects:
- kind: ServiceAccount
  name: ecommerce-sa

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecommerce-role
