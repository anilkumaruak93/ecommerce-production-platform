apiVersion: v1
kind: ResourceQuota

metadata:
  name: ecommerce-quota
  namespace: {{ .Release.Namespace }}

spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi

    limits.cpu: "32"
    limits.memory: 32Gi

    pods: "100"

    persistentvolumeclaims: "20"

    services: "30"

    configmaps: "50"

    secrets: "50"
