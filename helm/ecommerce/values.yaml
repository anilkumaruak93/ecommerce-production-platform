imagePullSecrets:
  - name: ecr-registry-credentials

services:

  frontend:
    image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/frontend
    tag: v0.1.0
    replicas: 1
    port: 8080
    serviceType: NodePort
    nodePort: 30081
    env:
      - name: PORT
        value: "8080"
      - name: LISTEN_ADDR
        value: "0.0.0.0"
      - name: ENABLE_TRACING
        value: "0"
      - name: ENABLE_PROFILER
        value: "0"
      - name: ENABLE_ASSISTANT
        value: "false"
      - name: PRODUCT_CATALOG_SERVICE_ADDR

        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shoppingassistantservice:8080"

  currencyservice:
    image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/currencyservice
    tag: v0.1.0
    replicas: 1
    port: 7000
    serviceType: ClusterIP
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "1"
      - name: ENABLE_PROFILER
        value: "0"
      - name: ENABLE_TRACING
        value: "0"
  productcatalogservice:
    image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/productcatalogservice
    tag: v0.1.0
    replicas: 1
    port: 3550
    serviceType: ClusterIP
    env:
      - name: PORT
        value: "3550"
      - name: DISABLE_PROFILER
        value: "1"
      - name: ENABLE_PROFILER
        value: "0"
      - name: ENABLE_TRACING
        value: "0"

  recommendationservice:
    image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/recommendationservice
    tag: v0.1.0
    replicas: 1
    port: 8080
    serviceType: ClusterIP

    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: DISABLE_PROFILER
        value: "1"
      - name: ENABLE_PROFILER
        value: "0"
      - name: ENABLE_TRACING
        value: "0"

  cartservice:
    image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/cartservice
    tag: v0.1.0
    replicas: 1
    port: 7070
    serviceType: ClusterIP

    env:
      - name: REDIS_ADDR
        value: "redis-cart:6379"
      - name: PORT
        value: "7070"
      - name: DISABLE_PROFILER
        value: "1"
      - name: ENABLE_PROFILER
        value: "0"
      - name: ENABLE_TRACING
        value: "0"

  redis-cart:
    image: redis
    tag: "7.2-alpine"
    replicas: 1
    port: 6379
    serviceType: ClusterIP
