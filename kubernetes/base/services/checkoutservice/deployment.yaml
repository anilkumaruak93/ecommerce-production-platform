apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: checkoutservice
    app.kubernetes.io/part-of: ecommerce-production-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkoutservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkoutservice
        app.kubernetes.io/part-of: ecommerce-production-platform
    spec:
      imagePullSecrets:
        - name: ecr-registry-credentials
      containers:
        - name: checkoutservice
          image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/checkoutservice:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 5050
              protocol: TCP
          env:
            - name: PORT
              value: "5050"
            - name: ENABLE_TRACING
              value: "0"
            - name: ENABLE_PROFILER
              value: "0"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: EMAIL_SERVICE_ADDR
              value: "emailservice:8080"
            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice:50051"
