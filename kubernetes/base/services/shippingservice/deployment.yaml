apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: shippingservice
    app.kubernetes.io/part-of: ecommerce-production-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shippingservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shippingservice
        app.kubernetes.io/part-of: ecommerce-production-platform
    spec:
      imagePullSecrets:
        - name: ecr-registry-credentials
      containers:
        - name: shippingservice
          image: 324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/shippingservice:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_TRACING
              value: "1"
            - name: DISABLE_PROFILER
              value: "1"
            - name: DISABLE_STATS
              value: "1"
