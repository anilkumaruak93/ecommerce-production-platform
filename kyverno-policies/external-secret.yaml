apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecommerce-db-secret
  namespace: ecommerce-helm

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ecommerce-db-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: ecommerce/db-password
        property: username

    - secretKey: password
      remoteRef:
        key: ecommerce/db-password
        property: password
