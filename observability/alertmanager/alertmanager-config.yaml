apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: gmail-config
  namespace: monitoring
  labels:
    release: monitoring

spec:
  route:
    receiver: gmail
    groupBy:
      - alertname

  receivers:
    - name: gmail
      emailConfigs:
        - to: "anilkumaruak93@gmail.com"
          from: "anilkumaruak93@gmail.com"
          smarthost: "smtp.gmail.com:587"

          authUsername: "anilkumaruak93@gmail.com"

          authPassword:
            name: alertmanager-gmail-secret
            key: password

          requireTLS: true
