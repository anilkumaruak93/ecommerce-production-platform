# Source: ecommerce/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: ecommerce-helm

  labels:
    app.kubernetes.io/name: adservice
    app.kubernetes.io/part-of: ecommerce-production-platform

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: adservice

  template:
    metadata:
      labels:
        app.kubernetes.io/name: adservice
        app.kubernetes.io/part-of: ecommerce-production-platform

    spec:

      serviceAccountName: ecommerce-sa

      imagePullSecrets:

        null


      containers:
        - name: adservice
          image: "324352301255.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/adservice:3f54f70aba100ffdc19042357e5bbd3390ae6802"
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

            capabilities:
              drop:
                - ALL

          resources:

            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

          ports:
            - containerPort: 9555

          startupProbe:
            tcpSocket:
              port: 9555
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 9555
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9555
            initialDelaySeconds: 15
            periodSeconds: 20

          envFrom:
            - configMapRef:
                name: adservice-config

          env:

            - name: PORT
              value: "9555"
            - name: DISABLE_PROFILER
              value: "1"
            - name: ENABLE_PROFILER
              value: "0"
            - name: ENABLE_TRACING
              value: "0"
